name: CI and scheduled refresh

on:
  push:
  pull_request:
  schedule:
    - cron: '15 20 * * 1'
  workflow_dispatch:

jobs:
  test-and-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m src.data.generate_synthetic
      - run: dbt seed --project-dir dbt --profiles-dir dbt
      - run: dbt run --project-dir dbt --profiles-dir dbt
      - run: dbt test --project-dir dbt --profiles-dir dbt
      - run: python -m src.pipeline
      - run: pytest -q
      - uses: actions/upload-artifact@v6
        with:
          name: banking-retention-report
          path: |
            reports/
            models/
